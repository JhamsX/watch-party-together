services:
  mysql:
    image: mysql:8.4
    container_name: together-watch-party-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
      MYSQL_DATABASE: watchparty
      MYSQL_USER: watchparty_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_app_password_change_me}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - watchparty_mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  watchparty_mysql_data:
